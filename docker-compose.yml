services:
  db:
    image: postgres:16-alpine
    container_name: pathfinder-db
    environment:
      POSTGRES_DB: ${DB_NAME:-student_pathfinder}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: pathfinder-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-9999}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-student_pathfinder}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-86400000}
      JWT_ISSUER: ${JWT_ISSUER:-pathfinder}
      PATHFINDER_ADMIN_USERNAME: ${PATHFINDER_ADMIN_USERNAME:-admin@example.com}
      PATHFINDER_ADMIN_PASSWORD: ${PATHFINDER_ADMIN_PASSWORD:-password}
      PATHFINDER_UPLOAD_DIR: /data/uploads
      GEMINI_API_URL: ${GEMINI_API_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${SERVER_PORT:-9999}:9999"
    volumes:
      - uploads:/data/uploads

volumes:
  db-data:
  uploads:

